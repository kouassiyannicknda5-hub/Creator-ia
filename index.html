<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#030408">
    <title>TCHALLAH CREATOR</title>
    
    <!-- Polices Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Styles CSS modulaires -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <div id="app">
        <!-- Barre supérieure -->
        <header id="topbar">
            <div class="brand" onclick="App.navigate('home')">TCHALLAH</div>
            <div class="topbar-actions">
                <button class="btn btn-primary" id="btn-export">📦 Exporter</button>
                <button id="btn-menu" aria-label="Menu">
                    <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z"/></svg>
                </button>
            </div>
        </header>

        <!-- Menu des modules -->
        <nav id="app-menu">
            <a href="#" class="menu-item" data-view="loop">
                <div class="menu-icon icon-loop">🔄</div>
                <span class="menu-label">Boucle</span>
            </a>
            <a href="#" class="menu-item" data-view="customize">
                <div class="menu-icon icon-appearance">🎨</div>
                <span class="menu-label">Apparence</span>
            </a>
            <a href="#" class="menu-item" data-view="voice">
                <div class="menu-icon icon-voice">🎙️</div>
                <span class="menu-label">Voix</span>
            </a>
            <a href="#" class="menu-item" data-view="search">
                <div class="menu-icon icon-search">🔍</div>
                <span class="menu-label">Recherche</span>
            </a>
            <a href="#" class="menu-item" data-view="brain">
                <div class="menu-icon icon-brain">🧠</div>
                <span class="menu-label">Cerveau</span>
            </a>
            <a href="#" class="menu-item" data-view="permissions">
                <div class="menu-icon icon-perms">🔐</div>
                <span class="menu-label">Sécurité</span>
            </a>
            <a href="#" class="menu-item" data-view="library">
                <div class="menu-icon icon-library">📚</div>
                <span class="menu-label">Mes IA</span>
            </a>
        </nav>

        <!-- Zone de contenu principal (injecté par JS) -->
        <main id="view-root"></main>
    </div>

    <!-- Notifications -->
    <div id="toasts"></div>

    <!-- Scripts JS modulaires -->
    <script src="js/state.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
